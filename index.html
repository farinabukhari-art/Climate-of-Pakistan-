
<!DOCTYPE html>
<html>
<head>
<title>Class 7 Climate Change Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
font-family: Arial, sans-serif;
background: #f2f7ff;
padding: 20px;
}

.quiz {
max-width: 600px;
margin: auto;
background: white;
padding: 25px;
border-radius: 15px;

box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

h1 {
text-align: center;
color: #1976d2;
}

.question {
margin-top: 20px;
font-weight: bold;
}

label {
display: block;
margin: 10px 0;
}

button {
width: 100%;

padding: 12px;
background: #1976d2;
color: white;
border: none;
border-radius: 8px;
font-size: 18px;
margin-top: 20px;
}

#result {
text-align: center;
font-size: 22px;
font-weight: bold;
margin-top: 20px;
}
</style>
</head>

<body>

<div class="quiz">

<h1>Climate Change Quiz</h1>

<div class="question">
1. What is the main cause of recent climate change?
</div>

<label>
<input type="radio" name="q1" value="a">
A. Greenhouse gases
</label>

<label>
<input type="radio" name="q1" value="b">
B. Moonlight
</label>

<label>

<input type="radio" name="q1" value="c">
C. Earthquakes
</label>


<div class="question">
2. Which gas contributes significantly to global warming?
</div>

<label>
<input type="radio" name="q2" value="a">
A. Oxygen
</label>

<label>
<input type="radio" name="q2" value="b">
B. Carbon dioxide
</label>

<label>
<input type="radio" name="q2" value="c">
C. Hydrogen
</label>


<div class="question">
3. Which activity increases carbon dioxide emissions?
</div>

<label>
<input type="radio" name="q3" value="a">
A. Planting trees
</label>

<label>
<input type="radio" name="q3" value="b">
B. Burning fossil fuels
</label>


<label>
<input type="radio" name="q3" value="c">
C. Recycling
</label>


<button onclick="checkQuiz()">Submit Quiz</button>

<div id="result"></div>

</div>

<script>

function checkQuiz() {

let score = 0;

if (document.querySelector('input[name="q1"]:checked')?.value === "a") {
score++;
}

if (document.querySelector('input[name="q2"]:checked')?.value === "b") {
score++;
}

if (document.querySelector('input[name="q3"]:checked')?.value === "b") {
score++;
}

document.getElementById("result").innerHTML =
"Your Score: " + score + " / 3";


}

</script>

</body>
</html>
